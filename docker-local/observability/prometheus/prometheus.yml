global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The auth-service exposes Prometheus metrics on its dedicated metrics port
  # (METRICS_ADDR, default :2112). When the auth-service runs on the host,
  # host.docker.internal resolves to the host from inside the Prometheus
  # container (see extra_hosts in docker-compose.yml). If you run the
  # auth-service inside this same compose network instead, change the target
  # to "auth-service:2112".
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:2112"]
        labels:
          service: auth-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
